name: Test Project

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - uses: actions/checkout@v3

      # Step 2: Set up Node.js (version 24)
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm" # Automatically caches node_modules for faster CI

      # Step 3: Install dependencies
      - run: npm ci

      # Step 4: Run tests
      - run: npm test

      # Step 5: Build project
      - run: npm run build
