name: Deploy Project

on:
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v3

      # Step 2: Setup Node.js (version 24) and cache dependencies
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"

      # Step 3: Install dependencies
      - run: npm ci

      # Step 4: Run tests
      - run: npm test

      # Step 5: Build project
      - run: npm run build

      # Step 6: Deploy (example, adjust as needed)
      - run: echo "Deployment step goes here"
